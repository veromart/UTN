<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepsheek</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="contenedor-mensaje">
        <form class="formulario-mensaje">
            <textarea placeholder="Mensaje a DeepSheek"></textarea>
            <div class="barra-inferior">
                <div class="opciones">
                    <button type="button" class="boton-pensamiento"><i class="bi bi-flower1" aria-hidden="true"></i>Pensamiento profundo</button>
                    <button type="button" class="boton-busqueda"><i class="bi bi-globe"></i>Búsqueda inteligente</button>
                </div>
                <div class="acciones">
                <button type="button" class="boton-adjunta" aria-label="Adjuntar archivo"><i class="bi bi-paperclip"></i>
                </button>   
                <button type="button" class="boton-enviar" aria-label="Enviar mensaje"><i class="bi bi-arrow-up"></i>
                </button>
                </div>
            </div>
        </form>
        <p class="aviso">Generado por IA, solo para referencia.</p>
    </div>
        </body>
</html>
